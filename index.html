<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#14120f" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f4efe6" media="(prefers-color-scheme: light)" />
    <title>Tic-Tac-Toe</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,560;0,9..144,680;1,9..144,560&family=Outfit:wght@380;520;640&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <script>
      try {
        var savedTheme = localStorage.getItem("ttt-theme");
        if (savedTheme === "light" || savedTheme === "dark") {
          document.documentElement.dataset.theme = savedTheme;
        }
      } catch (error) {}
    </script>
  </head>
  <body>
    <div class="confetti" aria-hidden="true"></div>
    <div class="app">
      <header class="top">
        <div class="brand">
          <p class="eyebrow">Three in a row</p>
          <h1>Tic-Tac-Toe</h1>
        </div>
        <div class="toolbar">
          <div class="modes" role="radiogroup" aria-label="Game mode">
            <button type="button" role="radio" data-mode="local" aria-checked="true">
              Pass &amp; play
            </button>
            <button type="button" role="radio" data-mode="cpu" aria-checked="false">
              Vs machine
            </button>
          </div>
          <div class="icon-buttons">
            <button type="button" id="theme-toggle" aria-pressed="false" aria-label="Switch to light theme">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path
                  class="icon-moon"
                  d="M15.5 14.5A6.5 6.5 0 0 1 9 4.2 6.5 6.5 0 1 0 15.5 14.5Z"
                />
                <g class="icon-sun">
                  <circle cx="12" cy="12" r="3.2" />
                  <path d="M12 3.5v1.8M12 18.7v1.8M3.5 12h1.8M18.7 12h1.8M6 6l1.3 1.3M16.7 16.7 18 18M18 6l-1.3 1.3M7.3 16.7 6 18" />
                </g>
              </svg>
            </button>
            <button type="button" id="mute-toggle" aria-pressed="false" aria-label="Mute sounds">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M4 10h3.2L12 6.2v11.6L7.2 14H4z" />
                <path class="icon-wave" d="M15.2 9.2a3.6 3.6 0 0 1 0 5.6M17.4 7a6.4 6.4 0 0 1 0 10" />
                <path class="icon-off" d="M16 10l4 4m0-4-4 4" />
              </svg>
            </button>
          </div>
        </div>
      </header>

      <main class="play">
        <p id="status" class="status" aria-live="polite"></p>
        <div class="stage">
          <div id="board" class="board" role="group" aria-label="Tic-tac-toe board"></div>
        </div>
      </main>

      <aside class="panel">
        <h2 class="panel-title">Match</h2>
        <div class="scores" id="scores">
          <article class="score" data-player="X">
            <span class="score-label" id="label-x">Player X</span>
            <strong id="score-x">0</strong>
          </article>
          <article class="score" data-player="draw">
            <span class="score-label">Draws</span>
            <strong id="score-d">0</strong>
          </article>
          <article class="score" data-player="O">
            <span class="score-label" id="label-o">Player O</span>
            <strong id="score-o">0</strong>
          </article>
        </div>
        <p class="hint" id="hint">
          Tap a square. With a keyboard, move with the arrows and press Enter.
        </p>
        <div class="actions">
          <button type="button" id="undo" class="ghost">Undo</button>
          <button type="button" id="again" class="primary">New round</button>
          <button type="button" id="reset" class="ghost" aria-label="Reset scores">Reset</button>
        </div>
      </aside>
    </div>
    <script src="game.js"></script>
  </body>
</html>
